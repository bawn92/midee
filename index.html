  <!-- Decide the landing route before paint. Mirrors src/landing/route.ts:
       `/` and `/welcome` are always the hero. Home lives at `/start`.
       `/play`, `/live`, and `/learn` are the mode routes. -->
  <script>
    ;(function () {
      try {
        var path = location.pathname.replace(/\/+$/, '') || '/'
        var hero = path === '/' || path === '/welcome'
        document.documentElement.dataset.route = hero ? 'hero' : 'app'
      } catch (e) {
        document.documentElement.dataset.route = 'app'
      }
    })()
  </script>
